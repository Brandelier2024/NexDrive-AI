name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 09:00 UTC on days 1, 6, 11, 16, 21, 26, 31 (max 5-day gap < 7-day pause limit)
    - cron: "0 9 */5 * *"
  workflow_dispatch: # Allows manual testing from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgREST / Postgres
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret"
            exit 1
          fi

          curl -fsS \
            "${SUPABASE_URL%/}/rest/v1/sync_state?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
