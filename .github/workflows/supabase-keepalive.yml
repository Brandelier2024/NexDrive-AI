name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 9 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgREST / Postgres
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d "\"'\r\n " )
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d "\"'\r\n " )

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret"
            exit 1
          fi

          if [[ "$KEY" == *.*.* ]]; then
            HTTP_CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              "${URL%/}/rest/v1/sync_state?select=id&limit=1" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}")
          else
            HTTP_CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              "${URL%/}/rest/v1/sync_state?select=id&limit=1" \
              -H "apikey: ${KEY}")
          fi

          cat /tmp/resp.txt
          echo ""
          echo "HTTP status: $HTTP_CODE"
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300
